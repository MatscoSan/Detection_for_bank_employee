<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Analyse des Risques & Relations</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: row;
            background-color: #0d0d0d;
            padding: 20px;
            color: #d4d4d4;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .chart-container { flex: 3; position: relative; background: #161616; border-radius: 12px; border: 1px solid #333; box-shadow: 0 4px 20px rgba(0,0,0,0.5); margin-right: 20px; padding: 10px; }
        .info-panel { flex: 1; background: #1a1a1a; border-radius: 12px; border: 1px solid #333; padding: 25px; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0,0,0,0.5); transition: all 0.3s ease; }
        .empty-state { text-align: center; color: #555; margin-top: 50%; }
        .card-header { border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 15px; }
        .card-score { font-size: 32px; font-weight: bold; color: #fff; }
        .card-role { text-transform: uppercase; font-size: 12px; letter-spacing: 1px; background: #333; padding: 4px 8px; border-radius: 4px; margin-left: 10px; }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; }
        .data-label { color: #888; }
        .data-value { color: #fff; font-family: 'Consolas', monospace; text-align: right; }
        .legend-box { margin-top: auto; padding-top: 20px; border-top: 1px solid #333; }
        .gradient-bar { height: 10px; border-radius: 5px; background: linear-gradient(to right, rgb(255, 240, 245), rgb(153, 0, 0)); margin: 10px 0; }
        .legend-labels { display: flex; justify-content: space-between; font-size: 10px; color: #666; }
    </style>
</head>
<body>
    <div class="chart-container">
        <canvas id="riskChart"></canvas>
    </div>
    <div class="info-panel" id="infoPanel">
        <div class="empty-state" id="emptyState">
            <h3>Sélectionnez un nœud</h3>
            <p>Cliquez sur une bulle pour voir les détails du client.</p>
        </div>
        <div id="cardContent" style="display: none;">
            <div class="card-header">
                <span id="displayScore" class="card-score">0%</span>
                <span id="displayRole" class="card-role">ROLE</span>
                <h3 id="displayId" style="margin: 5px 0 0 0; color: #aaa;">ID: ---</h3>
            </div>
            <div class="data-row"><span class="data-label">IBAN</span><span class="data-value" id="displayIban">---</span></div>
            <div class="data-row"><span class="data-label">Solde Compte</span><span class="data-value" id="displaySolde">---</span></div>
            <div class="data-row"><span class="data-label">Transactions</span><span class="data-value" id="displayTrans">0</span></div>
            <div class="data-row"><span class="data-label">Account ID</span><span class="data-value" id="displayAccId">---</span></div>
            <div class="data-row"><span class="data-label">BR ID</span><span class="data-value" id="displayBrId">---</span></div>
            <div class="data-row"><span class="data-label">Responsable ID</span><span class="data-value" id="displayResp">Aucun</span></div>
        </div>
        <div class="legend-box">
            <span style="font-size:12px; font-weight:bold;">Échelle de Risque</span>
            <div class="gradient-bar"></div>
            <div class="legend-labels"><span>Faible (0)</span><span>Élevé (100)</span></div>
        </div>
    </div>
    <script>

    Chart.register(ChartDataLabels);

    const total_customers = [
    {id:"p1", account_id:"A-1001", score:76, from_other_country:["A-1002","A-1003"], iban:"CH9300762011623852957", solde:"12 430.50", nb_of_transactions:45, br_id:"BR-01"},
    {id:"p2", account_id:"A-1002", score:51, from_other_country:["A-1005"], iban:"CH5604835012345678901", solde:"3 200.00", nb_of_transactions:12, br_id:"BR-02"},
    {id:"p3", account_id:"A-1003", score:63, from_other_country:[], iban:"CH7709001122334455660", solde:"8 950.10", nb_of_transactions:23, br_id:"BR-03"},
    {id:"p4", account_id:"A-1004", score:46, from_other_country:[], iban:"CH6209000000000000001", solde:"4 500.75", nb_of_transactions:8, br_id:"BR-01"},
    {id:"p5", account_id:"A-1005", score:58, from_other_country:["A-1003"], iban:"CH9300762011223344556", solde:"6 100.20", nb_of_transactions:15, br_id:"BR-02"}
    ];

    const pythonData = total_customers.map(c => ({
        id: c.id,
        score: c.score,
        iban: c.iban,
        solde: c.solde,
        nb_of_transactions: c.nb_of_transactions,
        account_id: c.account_id,
        br_id: c.br_id,
        links: c.from_other_country ? [...c.from_other_country] : []
    }));

    const idToIndexMap = {};
    pythonData.forEach((item, index) => { idToIndexMap[item.id] = index; });

    const accountIdToIdMap = {};
    pythonData.forEach(c => { accountIdToIdMap[c.account_id] = c.id; });

    // Convertit account_id en id pour les links
    pythonData.forEach(c => {
        c.links = c.links.map(accId => accountIdToIdMap[accId]).filter(id => id);
    });

    const chartData = pythonData.map(c => ({
        x: Math.random()*100,
        y: Math.random()*100,
        r: 8 + (c.score/3),
        customerInfo: c
    }));

    const COLOR_START = {r:255,g:240,b:245};
    const COLOR_END = {r:153,g:0,b:0};
    function getColorForScore(score){
        const ratio = score/100;
        const r = Math.round(COLOR_START.r - ratio*(COLOR_START.r - COLOR_END.r));
        const g = Math.round(COLOR_START.g - ratio*(COLOR_START.g - COLOR_END.g));
        const b = Math.round(COLOR_START.b - ratio*(COLOR_START.b - COLOR_END.b));
        return `rgba(${r},${g},${b},0.9)`;
    }
    const bgColors = pythonData.map(d => getColorForScore(d.score));

    const drawRelations = {
        id:'drawRelations',
        beforeDatasetsDraw(chart){
            const {ctx} = chart;
            const meta = chart.getDatasetMeta(0);
            pythonData.forEach((customer,index)=>{
                const childNode = meta.data[index];
                if(!childNode||childNode.hidden) return;
                customer.links.forEach(linkId=>{
                    const targetNode = meta.data[idToIndexMap[linkId]];
                    if(targetNode) drawArrow(ctx,childNode,targetNode,'rgba(255,255,255,0.6)');
                });
            });
        }
    };

    function drawArrow(ctx,fromNode,toNode,color){
        const dx=toNode.x-fromNode.x;
        const dy=toNode.y-fromNode.y;
        const angle=Math.atan2(dy,dx);
        const distance=Math.sqrt(dx*dx+dy*dy);
        const padding=toNode.options.radius+3;
        if(distance<padding+fromNode.options.radius) return;
        const endX=toNode.x-padding*Math.cos(angle);
        const endY=toNode.y-padding*Math.sin(angle);
        ctx.save();
        ctx.beginPath();
        ctx.strokeStyle=color;
        ctx.fillStyle=color;
        ctx.lineWidth=1.5;
        ctx.moveTo(fromNode.x,fromNode.y);
        ctx.lineTo(endX,endY);
        ctx.stroke();
        ctx.beginPath();
        const headLen=8;
        ctx.moveTo(endX,endY);
        ctx.lineTo(endX-headLen*Math.cos(angle-Math.PI/6),endY-headLen*Math.sin(angle-Math.PI/6));
        ctx.lineTo(endX-headLen*Math.cos(angle+Math.PI/6),endY-headLen*Math.sin(angle+Math.PI/6));
        ctx.fill();
        ctx.restore();
    }

    const ctx=document.getElementById('riskChart').getContext('2d');
    const riskChart=new Chart(ctx,{
        type:'bubble',
        data:{datasets:[{label:'Clients',data:chartData,backgroundColor:bgColors,borderColor:'rgba(255,255,255,0.3)',borderWidth:1}]},
        plugins:[drawRelations],
        options:{
            responsive:true,
            maintainAspectRatio:false,
            layout:{padding:40},
            plugins:{
                legend:{display:false},
                tooltip:{enabled:false},
                datalabels:{
                    color:'white',
                    font:{weight:'bold',size:10},
                    formatter:(val)=>val.customerInfo.score,
                    display:(ctx)=>ctx.dataset.data[ctx.dataIndex].r>12
                }
            },
            scales:{x:{display:false,min:-10,max:110},y:{display:false,min:-10,max:110}},
            onClick:(e)=>{
                const points=riskChart.getElementsAtEventForMode(e,'nearest',{intersect:true},true);
                if(points.length){
                    const customer=chartData[points[0].index].customerInfo;
                    updateCard(customer);
                }
            },
            onHover:(e,chartElement)=>{e.native.target.style.cursor=chartElement.length?'pointer':'default';}
        }
    });

    function updateCard(c){
        document.getElementById('emptyState').style.display='none';
        document.getElementById('cardContent').style.display='block';
        document.getElementById('displayId').innerText=`ID: ${c.id}`;
        document.getElementById('displayScore').innerText=`${c.score}%`;
        document.getElementById('displayScore').style.color=getColorForScore(c.score);
        document.getElementById('displayRole').innerText='N/A';
        document.getElementById('displayIban').innerText=c.iban||'N/A';
        document.getElementById('displaySolde').innerText=c.solde||'0';
        document.getElementById('displayTrans').innerText=c.nb_of_transactions;
        document.getElementById('displayAccId').innerText=c.account_id||'N/A';
        document.getElementById('displayBrId').innerText=c.br_id||'N/A';
        document.getElementById('displayResp').innerText=c.links.length?c.links.join(','):'Aucun';
    }
    </script>
