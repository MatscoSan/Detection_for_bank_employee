<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Graphic analyse risk</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h2 style="text-align: center;">Transaction analyse</h2>
        <div class="search-bar">
            <input id="client-search" list="clients-list" placeholder="Rechercher un client (nom ou id)" />
            <datalist id="clients-list"></datalist>
        </div>
        <div class="controls-row">
            <label for="max-nodes">Nombre max de nœuds :</label>
            <input id="max-nodes" type="number" min="1" max="500" value="50" />
            <button id="overview-btn">Vue d'ensemble</button>
            <button id="reset-btn">Réinitialiser</button>
        </div>
        
        <div class="chart-box">
            <canvas id="myBubbleChart"></canvas>
        </div>

        <div class="legend-container">
            <span class="legend-title">Risk intensity</span>
            <div class="gradient-bar-wrapper">
                <span class="legend-label">0</span>
                <div class="gradient-bar"></div>
                <span class="legend-label">100</span>
            </div>
            <p style="font-size: 11px; color: #666; margin-top: 10px;">The lines represent the transaction between 2 customers</p>
        </div>
    </div>

    <script src="data/customers_relationship_data.js"></script>
    <script src="scripts.js"></script>

</body>
</html>
