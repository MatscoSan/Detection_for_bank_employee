<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Graph analyze risk</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #000000;
            padding: 20px;
            color: #d4d4d4; 
        }

        .container {
            width: 80vw;
            max-width: 800px;
            background: rgb(20, 20, 20); 
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1); 
        }

        .chart-box {
            position: relative;
            height: 60vh;
            border: 1px solid #333;
            border-radius: 8px;
            background: #000;
        }

        /* Légende */
        .legend-container { margin-top: 20px; display: flex; flex-direction: column; align-items: center; }
        .legend-title { font-size: 14px; font-weight: bold; color: #d4d4d4; margin-bottom: 5px; }
        .gradient-bar-wrapper { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 400px; }
        .gradient-bar {
            flex-grow: 1; height: 15px; border-radius: 8px;
            background: linear-gradient(to right, rgb(255, 240, 245), rgb(153, 0, 0));
            border: 1px solid #333;
        }
        .legend-label { font-size: 12px; color: #c9c8c8; min-width: 30px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="text-align: center;">Analyze of the risk</h2>
        
        <div class="chart-box">
            <canvas id="myBubbleChart"></canvas>
        </div>

        <div class="legend-container">
            <span class="legend-title">Risk intensity</span>
            <div class="gradient-bar-wrapper">
                <span class="legend-label">0</span>
                <div class="gradient-bar"></div>
                <span class="legend-label">100</span>
            </div>
            <p style="font-size: 11px; color: #666; margin-top: 10px;">The arrows represent the transaction between people</p>
        </div>
    </div>

    <script>
        Chart.register(ChartDataLabels);

        // --- 1. COULEURS ---
        const COLOR_START = { r:255, g:240, b:245}; 
        const COLOR_END   = { r:153, g:0, b:0 };   

        function getColorForScore(score) {
            const ratio = score / 100;
            const r = Math.round(COLOR_START.r - ratio * (COLOR_START.r - COLOR_END.r));
            const g = Math.round(COLOR_START.g - ratio * (COLOR_START.g - COLOR_END.g));
            const b = Math.round(COLOR_START.b - ratio * (COLOR_START.b - COLOR_END.b));
            return `rgba(${r}, ${g}, ${b}, 0.9)`;
        }

        const rawData = [];
        const pointCount = 25; 

        for(let i=0; i<pointCount; i++) {
            const score = Math.floor(Math.random() * 101); 
            rawData.push({
                x: Math.random() * 100,
                y: Math.random() * 100,
                r: 12 + (score / 3), // Rayon un peu plus grand
                originalScore: score 
            });
        }

        // --- 3. DÉFINITION DES PARENTS/ENFANTS ---
        const interactions = [];
        for(let i=0; i<12; i++) {
            const indexA = Math.floor(Math.random() * pointCount);
            const indexB = Math.floor(Math.random() * pointCount);
            if(indexA !== indexB) {
                // from = Parent, to = Enfant
                interactions.push({ from: indexA, to: indexB });
            }
        }

        const bgColors = rawData.map(d => getColorForScore(d.originalScore));

        const drawNetworkArrows = {
            id: 'drawNetworkArrows',
              beforeDatasetsDraw(chart, args, options) {
                const { ctx } = chart;
                const meta = chart.getDatasetMeta(0);

                ctx.save();
                ctx.strokeStyle = 'rgba(255, 255, 255, 255)';
                ctx.fillStyle = 'rgba(255, 255, 255, 255)';   
                ctx.lineWidth = 1.5;

                interactions.forEach(link => {
                    const parent = meta.data[link.from];
                    const child = meta.data[link.to];

                    if(parent && child && !parent.hidden && !child.hidden) {
                        
                        // Calculs géométriques
                        const dx = child.x - parent.x;
                        const dy = child.y - parent.y;
                        const angle = Math.atan2(dy, dx); // Angle de la ligne
                        const distance = Math.sqrt(dx*dx + dy*dy);

                        // Rayon de la bulle enfant (pour s'arrêter au bord)
                        // On ajoute un petit 'padding' (ex: 2px) pour ne pas coller
                        const childRadius = child.options.radius + 2;

                        if(distance > childRadius + parent.options.radius) {
                            
                            const startX = parent.x; 
                            const startY = parent.y;

                            const endX = child.x - childRadius * Math.cos(angle);
                            const endY = child.y - childRadius * Math.sin(angle);

                            ctx.beginPath();
                            ctx.moveTo(startX, startY);
                            ctx.lineTo(endX, endY);
                            ctx.stroke();

                            const headLength = 10;
                            
                            ctx.beginPath();
                            ctx.moveTo(endX, endY);
                            ctx.lineTo(
                                endX - headLength * Math.cos(angle - Math.PI / 6),
                                endY - headLength * Math.sin(angle - Math.PI / 6)
                            );
                            ctx.lineTo(
                                endX - headLength * Math.cos(angle + Math.PI / 6),
                                endY - headLength * Math.sin(angle + Math.PI / 6)
                            );
                            ctx.closePath();
                            ctx.fill(); 
                        }
                    }
                });

                ctx.restore();
            }
        };

        const ctx = document.getElementById('myBubbleChart').getContext('2d');
        
        new Chart(ctx, {
            type: 'bubble',
            data: {
                datasets: [{
                    label: 'Entités',
                    data: rawData,
                    backgroundColor: bgColors,
                    borderColor: 'rgba(255,255,255,0.2)', 
                    borderWidth: 1
                }]
            },
            plugins: [drawNetworkArrows], 
            options: {
                responsive: true,
                maintainAspectRatio: false,
                layout: { padding: 30 }, 
                plugins: {
                    legend: { display: false },
                    tooltip: { enabled: false },
                    datalabels: {
                        color: 'white',
                        font: { weight: 'bold', size: 11 },
                        formatter: (val) => val.originalScore,
                        display: (ctx) => ctx.dataset.data[ctx.dataIndex].r > 15
                    }
                },
                scales: {
                    x: { display: false },
                    y: { display: false }
                }
            }
        });
    </script>

</body>
</html>
